<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHACHA ELECTRON</title><style>body{font-family:Arial;margin:0;background:#f4f7fb}header{background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;padding:20px;text-align:center}.auth,.store{padding:20px}.card{background:#fff;max-width:600px;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}input,select,button{width:100%;padding:10px;margin:6px 0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.product{background:#fff;padding:10px;border-radius:10px}.product img{width:100%;height:140px;object-fit:cover}.cart{background:#fff;padding:15px;margin-top:20px;border-radius:10px}</style></head><body><header><h1>CHACHA ELECTRON</h1></header><div id="auth" class="auth"><div class="card"><h2>Register</h2><input id="idnumber" placeholder="ID Number"><input id="password" type="password" placeholder="Password"><button onclick="registerUser()">Register</button><h2>Login</h2><input id="loginId" placeholder="ID Number"><input id="loginPassword" type="password" placeholder="Password"><button onclick="loginUser()">Login</button></div></div><div id="store" class="store" style="display:none"><div class="card"><input id="search" placeholder="Search" onkeyup="searchProducts()"></div><div id="products" class="products"></div><div class="cart"><h3>Cart (<span id="count">0</span>)</h3><ul id="cartItems"></ul><h2>Total KES <span id="total">0</span></h2><button onclick="checkout()">Pay via M-Pesa 0799446312</button></div></div><script>let cart=[];let total=0;const products=[];['Smartphones','Laptops','TVs','Electrical Cables'].forEach(c=>{for(let i=1;i<=50;i++)products.push({name:c+' Product '+i,category:c,price:1000+i*100,image:'https://via.placeholder.com/300x200?text='+encodeURIComponent(c)})});function registerUser(){localStorage.setItem('id',idnumber.value);localStorage.setItem('pass',password.value);alert('Registered')}function loginUser(){if(loginId.value===localStorage.getItem('id')&&loginPassword.value===localStorage.getItem('pass')){auth.style.display='none';store.style.display='block';render(products)}else alert('Invalid login')}function render(data){productsDiv=document.getElementById('products');productsDiv.innerHTML='';data.forEach(p=>productsDiv.innerHTML+=`<div class=product><img src='${p.image}'><h4>${p.name}</h4><p>KES ${p.price}</p><button onclick="addToCart('${p.name}',${p.price})">Add</button></div>`)}function searchProducts(){let s=search.value.toLowerCase();render(products.filter(p=>p.name.toLowerCase().includes(s)||p.category.toLowerCase().includes(s)))}function addToCart(n,p){cart.push({n,p});total+=p;count.innerText=cart.length;totalEl=document.getElementById('total');totalEl.innerText=total;cartItems.innerHTML+=`<li>${n} - ${p}</li>`}function checkout(){alert('Pay KES '+total+' to M-Pesa 0799446312');window.open('https://wa.me/254799446312','_blank')}</script></body></html>
